[pytest]
testpaths = .
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -ra -p lib.pytest_plugin
markers =
    tier1: Tier 1 isolated happy-path feature tests (F01-F34, F36-F37)
    tier2: Tier 2 boundary, negative, and corner-case tests (F01-F34, F36-F37)
    tier3: Tier 3 pairwise cross-feature combination tests
    tier4: Tier 4 real-world institutional/government/enterprise scenarios
    selftest: E2E harness self-tests (must pass offline without OpenRAG build)
    f01: F01 Clean Apache-2.0 Repo & Zero Exclusions
    f02: F02 Docker Standard & Airgap Stacks
    f03: F03 Declarative YAML Configs
    f04: F04 10-Schema PG 17/18 DDL (000-007)
    f05: F05 Capability-Guarded DB Fallback Mode
    f06: F06 128d Multi-Space Vector Columns
    f07: F07 ARN & dept_admin vs peer Fail-Closed RLS
    f08: F08 First-Class Permission Groups
    f09: F09 First-Class Permission Levels
    f10: F10 Explicit Deny > Allow & 3-Axis Policy Simulator
    f11: F11 M1 kordoc HWP/HWPX/HML Parser
    f12: F12 M1 Schift OCR + Mode Guard + Dewarp + pdf_native
    f13: F13 M2 Thumbnailer & 128d Visual Embed
    f14: F14 M3 Multi-Detector PII Engine
    f15: F15 M3 2-Stage PII Capsule & AES-256-GCM Vault
    f16: F16 M3 Configurable PII & Safe-Word Guard
    f17: F17 M3 Full-Layer Cascade Redaction
    f18: F18 M4 CCLG Immutable Memory Patch Ledger
    f19: F19 M4 Memory Promote Ladder
    f20: F20 M4 DB-Native LLM Wiki + KoParaRel + .md/Obsidian Sync
    f21: F21 M5 pg_pinecone 3-Engine Table-Level Switching
    f22: F22 M5 External Vector Adapters (S3 Vectors STS ARN & OSS)
    f23: F23 M5 Incremental Outbox, Watermarks & Quarantine
    f24: F24 M6 128d Multi-Space Hybrid Retriever & Admission
    f25: F25 M7 Policy-Enforced LLM Router
    f26: F26 M8 4-Axis Golden Set & Feedback Promotion
    f27: F27 M8 3-Track RAG Bench, A/B Search & AutoRAG Optimizer
    f28: F28 openrag CLI & Axum HTTP API Server
    f29: F29 Local Stdio & Streamable HTTP MCP Server
    f30: F30 P1 kordoc-mcp-bridge Plugin
    f31: F31 P2 docufinder-connector Plugin
    f32: F32 P3 ai-memory-hooks Plugin
    f33: F33 Tier 1 User Console (/app)
    f34: F34 Tier 2 Admin/Ops Studio (/studio)
    f36: F36 Canonical Concept / Alias Equivalence Graph
    f37: F37 First-Class Tag-Based Search & Faceted Filtering
