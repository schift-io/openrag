version: 1
profile: airgap

parse:
  hwp_engine: kordoc
  ocr_engine: local_vllm
  dewarp_enabled: true
  pdf_native_enabled: true
  default_ocr_mode: private
  ocr_mode_by_auth_level:
    - min_auth_level: 1
      required_mode: private
  reject_zdr_with_batch: true

thumbnail:
  format: webp
  max_edge_px: 1600
  figure_max_edge_px: 1280
  figure_max_bytes: 307200

pii:
  schift_v7: true
  marker_ko_pii: true
  schift_v6: false
  custom_dict_terms: []
  allowlist_terms: []
  capsule_enabled: true
  guard:
    enabled: true
    default_action: block
    allowlist: []
    rules:
      - kind: pii_category
        pattern_or_category: rrn_kr
        action: block
        surfaces: [inbound_query, llm_egress, mcp_egress, ingestion_gate]
        enabled: true
        priority: 10
      - kind: pii_category
        pattern_or_category: phone_kr
        action: mask
        surfaces: [inbound_query, llm_egress, mcp_egress, ingestion_gate]
        enabled: true
        priority: 20
      - kind: regex
        pattern_or_category: '(?i)\bsk-[a-z0-9][a-z0-9_-]{15,}'
        action: block
        surfaces: [inbound_query, llm_egress, mcp_egress, ingestion_gate]
        replacement_text: "[REDACTED_API_KEY]"
        enabled: true
        priority: 1

memory:
  backend: openrag_pg
  offline_fallback: true

store:
  pg_pinecone_engine: native
  dim: 256
  bm25_engine: pg_search
  bm25_fallback: pg_trgm
  external_mirror: none
  outbox_batch_size: 64
  outbox_max_attempts: 3

retrieve:
  # Text spaces are ranked by the embedding model alone: on Ko-StrategyQA (EmbeddingGemma-2 @256d)
  # BM25 fusion lowered nDCG@10 from 0.781 to 0.703, and convex alpha=0 skips the BM25 query.
  # Page thumbnails are not a default space: their vectors are visual and cannot be compared with
  # a text query vector. Without a text embedding model (OPENRAG_TEXT_EMBED_URL unset) the server
  # falls back to rrf, since hash vectors carry no meaning.
  spaces: [chunks, wiki, memory]
  fusion: convex
  rrf_k: 60
  alpha: 0.0
  top_k: 12
  rerank: true
  latest_revision_boost: 0.2
  admission_threshold: 0.4

# No bundled LLM. The model is whatever OPENRAG_LOCAL_LLM_URL / OPENRAG_LOCAL_LLM_MODEL point at
# (vLLM or any OpenAI-compatible server); without them answers come from the MCP client.
llm:
  external_provider: vllm_local
  external_model: ""
  local_provider: vllm_local
  local_model: ""
  local_only_min_auth_level: 1
  require_pii_masked_for_external: true

# Outbound HTTP in this profile goes only to the endpoints configured through the environment
# (OPENRAG_LOCAL_LLM_URL, OPENRAG_TEXT_EMBED_URL, OPENRAG_SCHIFT_OCR_URL, OPENRAG_S3_ENDPOINT).
# List any other host the server must reach: "host" (any port), "host:port" or a URL.
egress:
  allow: []
