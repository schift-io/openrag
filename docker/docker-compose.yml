services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "17"
    image: openrag/postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pg_pinecone
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openrag}
      POSTGRES_USER: ${POSTGRES_USER:-openrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrag_dev_pass}
      # Roles the API connects as (docker/postgres/initdb/10-openrag.sh creates them on first start)
      OPENRAG_APP_DB_PASSWORD: ${OPENRAG_APP_DB_PASSWORD:-openrag_app_dev_pass}
      OPENRAG_WORKER_DB_PASSWORD: ${OPENRAG_WORKER_DB_PASSWORD:-openrag_worker_dev_pass}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations:/openrag/migrations:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openrag} -d ${POSTGRES_DB:-openrag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One process: the API drains the indexing outbox inline, so there is no separate worker.
  openrag-api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    image: openrag/api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Request traffic runs as openrag_app (RLS enforced); background work as openrag_worker.
      DATABASE_URL: postgres://openrag_app:${OPENRAG_APP_DB_PASSWORD:-openrag_app_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      WORKER_DATABASE_URL: postgres://openrag_worker:${OPENRAG_WORKER_DB_PASSWORD:-openrag_worker_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-openrag}:${POSTGRES_PASSWORD:-openrag_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      OPENRAG_PIPELINE_CONFIG: ${OPENRAG_PIPELINE_CONFIG:-/app/configs/pipeline.default.yaml}
      # `docker compose exec openrag-api openrag init …` runs as the local operator (first org and key).
      OPENRAG_OPERATOR: "1"
      # 32-byte hex key that wraps the PII vault keys; without it the server uses a fixed dev key.
      OPENRAG_PII_KEK_HEX: ${OPENRAG_PII_KEK_HEX:?set OPENRAG_PII_KEK_HEX (openssl rand -hex 32)}
      # Page thumbnails are off by default (thumbnail.enabled in the pipeline config). When enabled
      # they go to this S3-compatible bucket (AWS S3, RustFS, ...), created on first start.
      OPENRAG_S3_ENDPOINT: ${OPENRAG_S3_ENDPOINT:-}
      OPENRAG_S3_BUCKET: ${OPENRAG_S3_BUCKET:-}
      OPENRAG_S3_REGION: ${OPENRAG_S3_REGION:-us-east-1}
      OPENRAG_S3_ACCESS_KEY_ID: ${OPENRAG_S3_ACCESS_KEY_ID:-}
      OPENRAG_S3_SECRET_ACCESS_KEY: ${OPENRAG_S3_SECRET_ACCESS_KEY:-}
      OPENRAG_S3_URL_STYLE: ${OPENRAG_S3_URL_STYLE:-path}
      # LLM for /v1/chat/completions and rag_ask: an OpenAI-compatible server (vLLM, ...).
      # Unset = none; MCP clients (Claude Code, Codex) answer from rag_search instead.
      OPENRAG_LOCAL_LLM_URL: ${OPENRAG_LOCAL_LLM_URL:-}
      OPENRAG_LOCAL_LLM_MODEL: ${OPENRAG_LOCAL_LLM_MODEL:-}
      OPENRAG_VLLM_LIVE: "1"
      OPENRAG_TEXT_EMBED_URL: ${OPENRAG_TEXT_EMBED_URL:-}
      OPENRAG_TEXT_EMBED_MODEL: ${OPENRAG_TEXT_EMBED_MODEL:-}
      OPENRAG_SCHIFT_OCR_URL: ${OPENRAG_SCHIFT_OCR_URL:-}
      SCHIFT_OCR_API_KEY: ${SCHIFT_OCR_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
    ports:
      - "${OPENRAG_API_PORT:-8080}:8080"
    volumes:
      - ../configs:/app/configs:ro

volumes:
  pg_data:
