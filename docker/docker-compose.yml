services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "17"
    image: openrag/postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pg_pinecone
      # The pg_pinecone worker REINDEXes a vector index once 20% of its table was inserted since the
      # last build (migration 014 registers the indexes). Without it the index is never rebuilt.
      - -c
      - pinecone.auto_maintain=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openrag}
      POSTGRES_USER: ${POSTGRES_USER:-openrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrag_dev_pass}
      # Roles the API connects as (docker/postgres/initdb/10-openrag.sh creates them on first start)
      OPENRAG_APP_DB_PASSWORD: ${OPENRAG_APP_DB_PASSWORD:-openrag_app_dev_pass}
      OPENRAG_WORKER_DB_PASSWORD: ${OPENRAG_WORKER_DB_PASSWORD:-openrag_worker_dev_pass}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations:/openrag/migrations:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openrag} -d ${POSTGRES_DB:-openrag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Text embeddings for meaning-based search: google/embeddinggemma-2 on CPU, used at 256
  # dimensions. The weights (about 1.5 GB) are downloaded from Hugging Face on first start into
  # the embed_models volume, so the first start takes a few minutes. To use another
  # OpenAI-compatible embeddings server instead, set OPENRAG_TEXT_EMBED_URL / _MODEL (and _API_KEY)
  # and start without this one: `up -d --no-deps postgres openrag-api`.
  local-embed:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/local-embed/Dockerfile
    image: ${OPENRAG_EMBED_IMAGE:-openrag/local-embed:local}
    restart: unless-stopped
    environment:
      EMBED_MODEL: ${OPENRAG_EMBED_MODEL:-google/embeddinggemma-2}
      EMBED_DEVICE: ${OPENRAG_EMBED_DEVICE:-cpu}
      EMBED_DTYPE: ${OPENRAG_EMBED_DTYPE:-float32}
      HF_HUB_OFFLINE: "0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - embed_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 900s

  # One process: the API drains the indexing outbox inline, so there is no separate worker.
  openrag-api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    image: openrag/api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      local-embed:
        condition: service_healthy
    environment:
      # Request traffic runs as openrag_app (RLS enforced); background work as openrag_worker.
      DATABASE_URL: postgres://openrag_app:${OPENRAG_APP_DB_PASSWORD:-openrag_app_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      WORKER_DATABASE_URL: postgres://openrag_worker:${OPENRAG_WORKER_DB_PASSWORD:-openrag_worker_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-openrag}:${POSTGRES_PASSWORD:-openrag_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      OPENRAG_PIPELINE_CONFIG: ${OPENRAG_PIPELINE_CONFIG:-/app/configs/pipeline.default.yaml}
      # `docker compose exec openrag-api openrag init …` runs as the local operator (first org and key).
      OPENRAG_OPERATOR: "1"
      # Address printed in init's connect commands: the published port on this host by default.
      OPENRAG_PUBLIC_URL: ${OPENRAG_PUBLIC_URL:-http://127.0.0.1:${OPENRAG_API_PORT:-8080}}
      # 32-byte hex key that wraps the PII vault keys; without it the server uses a fixed dev key.
      OPENRAG_PII_KEK_HEX: ${OPENRAG_PII_KEK_HEX:?set OPENRAG_PII_KEK_HEX (openssl rand -hex 32)}
      # Page thumbnails are off by default (thumbnail.enabled in the pipeline config). When enabled
      # they go to this S3-compatible bucket (AWS S3, RustFS, ...), created on first start.
      OPENRAG_S3_ENDPOINT: ${OPENRAG_S3_ENDPOINT:-}
      OPENRAG_S3_BUCKET: ${OPENRAG_S3_BUCKET:-}
      OPENRAG_S3_REGION: ${OPENRAG_S3_REGION:-us-east-1}
      OPENRAG_S3_ACCESS_KEY_ID: ${OPENRAG_S3_ACCESS_KEY_ID:-}
      OPENRAG_S3_SECRET_ACCESS_KEY: ${OPENRAG_S3_SECRET_ACCESS_KEY:-}
      OPENRAG_S3_URL_STYLE: ${OPENRAG_S3_URL_STYLE:-path}
      # LLM for /v1/chat/completions and rag_ask: an OpenAI-compatible server (vLLM, ...).
      # Unset = none; MCP clients (Claude Code, Codex) answer from rag_search instead.
      OPENRAG_LOCAL_LLM_URL: ${OPENRAG_LOCAL_LLM_URL:-}
      OPENRAG_LOCAL_LLM_MODEL: ${OPENRAG_LOCAL_LLM_MODEL:-}
      OPENRAG_VLLM_LIVE: "1"
      # Embeddings: local-embed by default, or any OpenAI-compatible /v1/embeddings server.
      # Query/document prefixes: embeddinggemma's are built in; set them for other asymmetric
      # models (e5: "query: " / "passage: ").
      OPENRAG_TEXT_EMBED_URL: ${OPENRAG_TEXT_EMBED_URL:-http://local-embed:8082/v1/embeddings}
      OPENRAG_TEXT_EMBED_MODEL: ${OPENRAG_TEXT_EMBED_MODEL:-google/embeddinggemma-2}
      OPENRAG_TEXT_EMBED_API_KEY: ${OPENRAG_TEXT_EMBED_API_KEY:-}
      OPENRAG_TEXT_EMBED_QUERY_PREFIX: ${OPENRAG_TEXT_EMBED_QUERY_PREFIX:-}
      OPENRAG_TEXT_EMBED_DOCUMENT_PREFIX: ${OPENRAG_TEXT_EMBED_DOCUMENT_PREFIX:-}
      # Watched document folders (paths inside this container): new files are ingested, changed
      # ones replace their in-force copy, moved/renamed ones keep their document, deleted ones go
      # out of force (records kept). A JSON list; entries may set their own bucket and types:
      #   ["/docs", {"path": "/docs-hr", "bucket": "hr", "types": ["pdf", "hwp"]}]
      # Every folder listed here needs a mount below. Empty: no watching.
      OPENRAG_DOCS_DIRS: ${OPENRAG_DOCS_DIRS:-["/docs"]}
      OPENRAG_DOCS_TYPES: ${OPENRAG_DOCS_TYPES:-hwp,hwpx,md,pdf,docx,pptx,html}
      OPENRAG_DOCS_BUCKET: ${OPENRAG_DOCS_BUCKET:-docs}
      OPENRAG_DOCS_SCAN_SECS: ${OPENRAG_DOCS_SCAN_SECS:-30}
      OPENRAG_SCHIFT_OCR_URL: ${OPENRAG_SCHIFT_OCR_URL:-}
      SCHIFT_OCR_API_KEY: ${SCHIFT_OCR_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
    ports:
      - "${OPENRAG_API_PORT:-8080}:8080"
    volumes:
      - ../configs:/app/configs:ro
      # The documents folder on this machine (default: documents/ next to docker/), read-only.
      # More folders: add a line per folder, e.g. `- /Volumes/NAS/규정:/docs/nas-규정:ro` (inside
      # /docs, so it is watched as part of it) or a path of its own listed in OPENRAG_DOCS_DIRS.
      - ${OPENRAG_DOCS_DIR:-../documents}:/docs:ro

volumes:
  pg_data:
  embed_models:
