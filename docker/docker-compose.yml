services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "17"
    image: openrag/postgres:17
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pg_pinecone
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openrag}
      POSTGRES_USER: ${POSTGRES_USER:-openrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrag_dev_pass}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openrag} -d ${POSTGRES_DB:-openrag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-openrag_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-openrag_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-openrag_minio} $${S3_SECRET_KEY:-openrag_minio_secret} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-openrag-artifacts};
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openrag_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openrag_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-openrag-artifacts}

  openrag-api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openrag}:${POSTGRES_PASSWORD:-openrag_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      OPENRAG_CONFIG: ${OPENRAG_CONFIG:-/app/configs/pipeline.default.yaml}
      OPENRAG_VAULT_MASTER_KEY: ${OPENRAG_VAULT_MASTER_KEY:-dev_only_32_byte_master_key_override_me}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-openrag-artifacts}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openrag_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openrag_minio_secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SCHIFT_OCR_API_KEY: ${SCHIFT_OCR_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
    ports:
      - "${OPENRAG_API_PORT:-8080}:8080"
    volumes:
      - ../configs:/app/configs:ro

  openrag-worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    command: ["openrag", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openrag}:${POSTGRES_PASSWORD:-openrag_dev_pass}@postgres:5432/${POSTGRES_DB:-openrag}
      OPENRAG_CONFIG: ${OPENRAG_CONFIG:-/app/configs/pipeline.default.yaml}
      OPENRAG_VAULT_MASTER_KEY: ${OPENRAG_VAULT_MASTER_KEY:-dev_only_32_byte_master_key_override_me}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-openrag-artifacts}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-openrag_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-openrag_minio_secret}
    volumes:
      - ../configs:/app/configs:ro

  openrag-web:
    profiles: ["app"]
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - openrag-api
    environment:
      NEXT_PUBLIC_OPENRAG_API_URL: ${NEXT_PUBLIC_OPENRAG_API_URL:-http://localhost:8080}
      OPENRAG_API_INTERNAL_URL: http://openrag-api:8080
    ports:
      - "${OPENRAG_WEB_PORT:-3000}:3000"

volumes:
  pg_data:
  minio_data:
