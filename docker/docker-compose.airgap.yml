# Air-gapped overlay: docker compose -f docker-compose.yml -f docker-compose.airgap.yml \
#   --profile app --profile airgap up -d postgres object-store local-embed openrag-api
# (openrag-web is left out: its build context ../web is not in this repository.)
#
# postgres, object-store and local-embed sit on an internal network with no route out. openrag-api is
# also on openrag_edge so clients can reach its port and it can reach the site's own LLM / OCR
# servers. The embedding weights come from a Hugging Face hub cache mounted read-only at /models
# (AIRGAP_MODEL_DIR), filled beforehand on a connected machine with
#   hf download google/embeddinggemma-2 --cache-dir ./models
# No LLM is bundled. Point AIRGAP_LLM_URL / AIRGAP_LLM_MODEL at the site's vLLM (or any
# OpenAI-compatible chat completions server); left empty, /v1/chat/completions answers 503 and
# MCP clients answer from rag_search. AIRGAP_EMBED_URL can likewise replace local-embed.
networks:
  openrag_airgap:
    driver: bridge
    internal: true
  openrag_edge:
    driver: bridge

services:
  postgres:
    networks: [openrag_airgap]

  object-store:
    networks: [openrag_airgap]

  local-embed:
    profiles: ["airgap"]
    build:
      context: ..
      dockerfile: docker/local-embed/Dockerfile
    image: ${AIRGAP_EMBED_IMAGE:-openrag/local-embed:local}
    restart: unless-stopped
    networks: [openrag_airgap]
    environment:
      EMBED_MODEL: ${AIRGAP_EMBED_MODEL:-google/embeddinggemma-2}
      EMBED_DEVICE: ${AIRGAP_EMBED_DEVICE:-cpu}
      EMBED_DTYPE: ${AIRGAP_EMBED_DTYPE:-float32}
    volumes:
      - ${AIRGAP_MODEL_DIR:-./models}:/models:ro

  openrag-api:
    networks: [openrag_airgap, openrag_edge]
    environment:
      OPENRAG_PIPELINE_CONFIG: /app/configs/pipeline.airgap.yaml
      OPENRAG_TEXT_EMBED_URL: ${AIRGAP_EMBED_URL:-http://local-embed:8082/v1/embeddings}
      OPENRAG_TEXT_EMBED_MODEL: ${AIRGAP_EMBED_MODEL:-google/embeddinggemma-2}
      # The site's LLM server; both empty = no server-side LLM
      OPENRAG_LOCAL_LLM_URL: ${AIRGAP_LLM_URL:-}
      OPENRAG_LOCAL_LLM_MODEL: ${AIRGAP_LLM_MODEL:-}
      # OCR: a Schift OCR endpoint reachable from inside (on-prem Schift or a compatible server); empty = no OCR
      OPENRAG_SCHIFT_OCR_URL: ${AIRGAP_OCR_URL:-}
      SCHIFT_OCR_API_KEY: ${SCHIFT_OCR_API_KEY:-}
      OPENROUTER_API_KEY: ""
      PINECONE_API_KEY: ""

  openrag-web:
    networks: [openrag_airgap]
