# Air-gapped overlay: docker compose -f docker-compose.yml -f docker-compose.airgap.yml \
#   --profile app --profile airgap up -d postgres vllm local-embed openrag-api
# (openrag-web is left out: its build context ../web is not in this repository.)
# Every service sits on an internal network with no route out. Model weights come from a
# Hugging Face hub cache mounted read-only at /models (AIRGAP_MODEL_DIR), filled beforehand with
#   hf download google/embeddinggemma-2 --cache-dir ./models
#   hf download Qwen/Qwen2.5-32B-Instruct --cache-dir ./models
# The LLM and the embeddings can be any OpenAI-compatible server: point AIRGAP_LLM_URL /
# AIRGAP_EMBED_URL elsewhere and leave out the bundled vllm / local-embed services.
networks:
  openrag_airgap:
    driver: bridge
    internal: true

services:
  postgres:
    networks: [openrag_airgap]

  minio:
    networks: [openrag_airgap]

  minio-init:
    networks: [openrag_airgap]

  vllm:
    profiles: ["airgap"]
    image: ${AIRGAP_VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    networks: [openrag_airgap]
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_CACHE: /models
    command:
      - --model
      - ${AIRGAP_LLM_MODEL:-Qwen/Qwen2.5-32B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - ${AIRGAP_MODEL_DIR:-./models}:/models:ro

  local-embed:
    profiles: ["airgap"]
    build:
      context: ..
      dockerfile: docker/local-embed/Dockerfile
    image: ${AIRGAP_EMBED_IMAGE:-openrag/local-embed:local}
    restart: unless-stopped
    networks: [openrag_airgap]
    environment:
      EMBED_MODEL: ${AIRGAP_EMBED_MODEL:-google/embeddinggemma-2}
      EMBED_DEVICE: ${AIRGAP_EMBED_DEVICE:-cpu}
      EMBED_DTYPE: ${AIRGAP_EMBED_DTYPE:-float32}
    volumes:
      - ${AIRGAP_MODEL_DIR:-./models}:/models:ro

  openrag-api:
    networks: [openrag_airgap]
    environment:
      OPENRAG_PIPELINE_CONFIG: /app/configs/pipeline.airgap.yaml
      OPENRAG_TEXT_EMBED_URL: ${AIRGAP_EMBED_URL:-http://local-embed:8082/v1/embeddings}
      OPENRAG_TEXT_EMBED_MODEL: ${AIRGAP_EMBED_MODEL:-google/embeddinggemma-2}
      # On-prem LLM: vLLM or any OpenAI-compatible chat completions server
      OPENRAG_LOCAL_LLM_URL: ${AIRGAP_LLM_URL:-http://vllm:8000/v1}
      OPENRAG_LOCAL_LLM_MODEL: ${AIRGAP_LLM_MODEL:-Qwen/Qwen2.5-32B-Instruct}
      OPENRAG_VLLM_LIVE: "1"
      # OCR: a Schift OCR endpoint reachable from inside (on-prem Schift or a compatible server); empty = no OCR
      OPENRAG_SCHIFT_OCR_URL: ${AIRGAP_OCR_URL:-}
      SCHIFT_OCR_API_KEY: ${SCHIFT_OCR_API_KEY:-}
      OPENROUTER_API_KEY: ""
      PINECONE_API_KEY: ""

  openrag-web:
    networks: [openrag_airgap]
